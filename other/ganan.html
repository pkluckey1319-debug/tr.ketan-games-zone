<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Std 8 Maths Runner Game - Track Fixed</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            touch-action: manipulation;
        }

        /* Start Screen - Name Input */
        #startModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            padding: 20px;
        }
        #startModal h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-align: center;
        }
        #playerNameInput {
            padding: 12px 20px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            outline: none;
            text-align: center;
            width: 80%;
            max-width: 300px;
            margin-bottom: 20px;
        }
        #startBtn {
            padding: 12px 35px;
            font-size: 22px;
            font-weight: bold;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #startBtn:active {
            transform: scale(0.95);
        }

        /* Gameplay UI */
        #ui-container {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        #playerDisplay {
            color: #fde047;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px #000;
        }
        #questionBox {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 12px;
            font-size: 26px;
            font-weight: bold;
            color: #1e293b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 3px solid #0284c7;
            text-align: center;
        }
        #scoreBoard {
            margin-top: 8px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
        }

        /* Visual Feedback Overlay (Checkmark / Cross) */
        #feedbackOverlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 110px;
            font-weight: bold;
            pointer-events: none;
            z-index: 50;
            transition: transform 0.2s ease-out, opacity 0.3s ease-out;
            opacity: 0;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        .correct-mark {
            color: #22c55e;
        }
        .wrong-mark {
            color: #ef4444;
        }

        /* Mobile Touch Controls */
        #mobileControls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 20;
        }
        .touchBtn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .touchBtn:active {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Game Over Modal */
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: none;
            text-align: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 25px 40px;
            border-radius: 15px;
            border: 2px solid #ef4444;
            width: 85%;
            max-width: 380px;
            z-index: 30;
        }
        #restartBtn {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 18px;
            background-color: #eab308;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Visual Feedback -->
    <div id="feedbackOverlay"></div>

    <!-- Start Modal -->
    <div id="startModal">
        <h2>ગણિત રનર રમતમાં સ્વાગત છે!</h2>
        <p style="margin-bottom: 15px; color: #cbd5e1;">વિદ્યાર્થીનું નામ દાખલ કરો:</p>
        <input type="text" id="playerNameInput" placeholder="અહીં નામ લખો..." autofocus />
        <button id="startBtn" onclick="startGame()">રમત શરૂ કરો ➔</button>
    </div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <div id="playerDisplay">ખેલાડી: <span id="displayName">--</span></div>
        <div id="questionBox"><span id="mathQuestion">પ્રશ્ન લોડ થાય છે...</span></div>
        <div id="scoreBoard">સ્કોર: <span id="score">0</span></div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobileControls">
        <div class="touchBtn" onclick="moveLeft()">◀</div>
        <div class="touchBtn" onclick="moveRight()">▶</div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOver">
        <span style="color: #ef4444;">Game Over!</span><br>
        <p style="font-size: 18px; color: #cbd5e1; margin: 10px 0 5px 0;" id="finalPlayerName"></p>
        <span style="font-size: 20px;">તમારો સ્કોર: <span id="finalScore">0</span></span><br>
        <button id="restartBtn" onclick="restartGame()">ફરી રમો 🔄</button>
    </div>

    <script>
        let playerName = "વિદ્યાર્થી";

        // --- Sound Generator Using Web Audio API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgMusicInterval = null;

        function playTone(freq, type, duration) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Sound Effects
        function playCorrectSound() {
            playTone(523.25, 'sine', 0.15); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.25), 100); // E5
        }

        function playWrongSound() {
            playTone(220, 'sawtooth', 0.2);
            setTimeout(() => playTone(180, 'sawtooth', 0.3), 150);
        }

        // Simple Background Music Loop
        function startBGM() {
            const notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
            let noteIdx = 0;
            bgMusicInterval = setInterval(() => {
                if (gameActive) {
                    playTone(notes[noteIdx], 'triangle', 0.15);
                    noteIdx = (noteIdx + 1) % notes.length;
                }
            }, 350);
        }

        function stopBGM() {
            if (bgMusicInterval) clearInterval(bgMusicInterval);
        }

        // --- Visual Feedback Animation ---
        function showFeedback(type) {
            const overlay = document.getElementById('feedbackOverlay');
            if (type === 'correct') {
                overlay.innerText = '✔';
                overlay.className = 'correct-mark';
            } else {
                overlay.innerText = '✖';
                overlay.className = 'wrong-mark';
            }

            overlay.style.opacity = '1';
            overlay.style.transform = 'translate(-50%, -50%) scale(1.3)';

            setTimeout(() => {
                overlay.style.opacity = '0';
                overlay.style.transform = 'translate(-50%, -50%) scale(0)';
            }, 500);
        }

        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.Fog(0x0f172a, 20, 90);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10);
        scene.add(dirLight);

        // Track (રસ્તો પહળો કર્યો - ૧૪ યુનિટ)
        const trackGeometry = new THREE.PlaneGeometry(14, 1000);
        const trackMaterial = new THREE.MeshLambertMaterial({ color: 0x1e293b });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -450;
        scene.add(track);

        // Lanes: Left = -2.5, Center = 0, Right = 2.5 (લેન વચ્ચેનું અંતર ઘટાડ્યું જેથી રસ્તાની બહાર ન જાય)
        const lanes = [-2.5, 0, 2.5];
        let currentLane = 1; 

        // --- 2. 3D Animated Character ---
        const playerGroup = new THREE.Group();

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });

        // Head
        const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 1.9;
        playerGroup.add(head);

        // Torso
        const torsoGeo = new THREE.BoxGeometry(0.7, 0.9, 0.4);
        const torso = new THREE.Mesh(torsoGeo, shirtMat);
        torso.position.y = 1.25;
        playerGroup.add(torso);

        // Arms
        const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
        const leftArm = new THREE.Mesh(armGeo, shirtMat);
        leftArm.position.set(-0.45, 1.25, 0);
        playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, shirtMat);
        rightArm.position.set(0.45, 1.25, 0);
        playerGroup.add(rightArm);

        // Legs
        const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
        const leftLeg = new THREE.Mesh(legGeo, pantsMat);
        leftLeg.position.set(-0.2, 0.4, 0);
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, pantsMat);
        rightLeg.position.set(0.2, 0.4, 0);
        playerGroup.add(rightLeg);

        playerGroup.position.set(lanes[currentLane], 0, 0);
        scene.add(playerGroup);

        camera.position.set(0, 4.5, 7);
        camera.lookAt(0, 1.2, -5);

        // Game State Variables
        let score = 0;
        let gameActive = false;
        let speed = 0.35;
        let currentQuestion = { text: "", answer: 0 };
        let activeAnswers = [];
        let runAnimTime = 0;

        // Start Game
        function startGame() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const input = document.getElementById('playerNameInput').value.trim();
            if (input !== "") {
                playerName = input;
            }
            document.getElementById('displayName').innerText = playerName;
            document.getElementById('startModal').style.display = 'none';
            
            gameActive = true;
            startBGM();
            generateBasicMathQuestion();
            animate();
        }

        // Control Functions
        function moveLeft() {
            if (gameActive && currentLane > 0) {
                currentLane--;
            }
        }

        function moveRight() {
            if (gameActive && currentLane < 2) {
                currentLane++;
            }
        }

        // Keyboard Controls
        document.addEventListener('keydown', (event) => {
            if (!gameActive) {
                if (event.code === 'Space') restartGame();
                return;
            }
            if (event.key === 'ArrowLeft' || event.key === 'a') moveLeft();
            if (event.key === 'ArrowRight' || event.key === 'd') moveRight();
        });

        // Touch Swipe Controls for Mobile
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, false);

        document.addEventListener('touchend', (e) => {
            if (!gameActive) return;
            let touchEndX = e.changedTouches[0].clientX;
            let diffX = touchEndX - touchStartX;

            if (Math.abs(diffX) > 30) {
                if (diffX > 0) {
                    moveRight();
                } else {
                    moveLeft();
                }
            }
        }, false);

        // Question Generator
        function generateBasicMathQuestion() {
            const operations = ['multiply', 'divide', 'integers', 'add_sub'];
            const op = operations[Math.floor(Math.random() * operations.length)];

            let qText = "";
            let ans = 0;

            if (op === 'multiply') {
                const n1 = Math.floor(Math.random() * 10) + 11;
                const n2 = Math.floor(Math.random() * 9) + 2;
                qText = `${n1} × ${n2} = ?`;
                ans = n1 * n2;
            } else if (op === 'divide') {
                const divisor = Math.floor(Math.random() * 10) + 3;
                const quotient = Math.floor(Math.random() * 12) + 2;
                const dividend = divisor * quotient;
                qText = `${dividend} ÷ ${divisor} = ?`;
                ans = quotient;
            } else if (op === 'integers') {
                const a = Math.floor(Math.random() * 20) - 10;
                const b = Math.floor(Math.random() * 15) + 1;
                if(Math.random() < 0.5) {
                    qText = `(${a}) + ${b} = ?`;
                    ans = a + b;
                } else {
                    qText = `${a} - ${b} = ?`;
                    ans = a - b;
                }
            } else if (op === 'add_sub') {
                const n1 = Math.floor(Math.random() * 40) + 20;
                const n2 = Math.floor(Math.random() * 30) + 10;
                if(Math.random() < 0.5) {
                    qText = `${n1} + ${n2} = ?`;
                    ans = n1 + n2;
                } else {
                    qText = `${n1} - ${n2} = ?`;
                    ans = n1 - n2;
                }
            }

            currentQuestion = { text: qText, answer: ans };
            document.getElementById('mathQuestion').innerText = qText;

            spawnAnswerBlocks(ans);
        }

        // Answer Blocks
        function spawnAnswerBlocks(correctAnswer) {
            let options = [correctAnswer];
            
            while(options.length < 3) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() < 0.5 ? 1 : -1);
                let wrongAns = correctAnswer + offset;
                if(!options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            options.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 3; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'Bold 45px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(options[i], 64, 64);

                const texture = new THREE.CanvasTexture(canvas);
                const blockGeo = new THREE.BoxGeometry(2, 2, 0.5);
                const blockMat = new THREE.MeshBasicMaterial({ map: texture });
                const block = new THREE.Mesh(blockGeo, blockMat);

                // બ્લોક્સની જગ્યા પણ નવી લેન મુજબ ગોઠવી
                block.position.set(lanes[i], 1, -65);
                block.userData = { value: options[i] };

                scene.add(block);
                activeAnswers.push(block);
            }
        }

        // Animation Loop
        function animate() {
            if (!gameActive) return;

            requestAnimationFrame(animate);

            // Smooth Movement
            playerGroup.position.x += (lanes[currentLane] - playerGroup.position.x) * 0.25;

            // Running Animation
            runAnimTime += 0.15;
            leftArm.rotation.x = Math.sin(runAnimTime) * 0.7;
            rightArm.rotation.x = -Math.sin(runAnimTime) * 0.7;
            leftLeg.rotation.x = -Math.sin(runAnimTime) * 0.7;
            rightLeg.rotation.x = Math.sin(runAnimTime) * 0.7;
            playerGroup.position.y = Math.abs(Math.sin(runAnimTime * 2)) * 0.1;

            // Move Blocks & Check Collision
            for (let i = activeAnswers.length - 1; i >= 0; i--) {
                const block = activeAnswers[i];
                block.position.z += speed;

                const dz = Math.abs(playerGroup.position.z - block.position.z);
                const dx = Math.abs(playerGroup.position.x - block.position.x);

                if (dz < 0.8 && dx < 0.8) {
                    if (block.userData.value === currentQuestion.answer) {
                        // Correct Answer
                        playCorrectSound();
                        showFeedback('correct');
                        score += 10;
                        document.getElementById('score').innerText = score;
                        clearAnswers();
                        generateBasicMathQuestion();
                        break;
                    } else {
                        // Wrong Answer
                        playWrongSound();
                        showFeedback('wrong');
                        gameOver();
                        break;
                    }
                }

                if (block.position.z > 5) {
                    scene.remove(block);
                    activeAnswers.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function clearAnswers() {
            activeAnswers.forEach(b => scene.remove(b));
            activeAnswers = [];
        }

        function gameOver() {
            gameActive = false;
            stopBGM();
            document.getElementById('finalPlayerName').innerText = `ખેલાડી: ${playerName}`;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            clearAnswers();
            currentLane = 1;
            playerGroup.position.set(lanes[currentLane], 0, 0);
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('gameOver').style.display = 'none';

            gameActive = true;
            startBGM();
            generateBasicMathQuestion();
            animate();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
