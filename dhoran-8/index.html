<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ધોરણ ૮ - શૈક્ષણિક રમતો</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #fff5f5; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { color: #b83280; margin-bottom: 5px; }
        p.sub { color: #4a5568; margin-bottom: 30px; }
        
        .subject-title { 
            font-size: 20px; 
            color: #2d3748; 
            font-weight: bold;
            text-align: left; 
            max-width: 850px; 
            margin: 30px auto 15px auto; 
            border-bottom: 2px solid #cbd5e0; 
            padding-bottom: 5px; 
        }
        
        .container { 
            display: flex; 
            justify-content: flex-start; 
            gap: 20px; 
            flex-wrap: wrap; 
            max-width: 850px; 
            margin: 0 auto; 
        }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 20px; 
            width: 220px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .card-math { border-top: 5px solid #dd6b20; }
        .card-science { border-top: 5px solid #38a169; }
        
        .card h3 { 
            color: #2d3748; 
            font-size: 18px; 
            margin-top: 0;
            margin-bottom: 15px; 
        }

        .btn { 
            display: inline-block; 
            padding: 8px 16px; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
        }
        
        .btn-math { background-color: #dd6b20; }
        .btn-math:hover { background-color: #c05621; }

        .btn-science { background-color: #38a169; }
        .btn-science:hover { background-color: #2f855a; }

        .back-btn { 
            display: inline-block; 
            margin-top: 40px; 
            color: #4a5568; 
            text-decoration: none; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <h1>🎓 ધોરણ ૮ - શૈક્ષણિક રમતો</h1>
    <p class="sub">ગણિત અને વિજ્ઞાન વિષયની રમતો</p>

    <!-- ૧. ગણિત વિભાગ -->
    <div class="subject-title">📐 ગણિત (Maths)</div>
    <div class="container">

        <!-- ગણિતની રમત ૧ -->
        <div class="card card-math">
            <h3>સંમેય સંખ્યાઓ</h3>
            <a href="./samey-samkhya.html" class="btn btn-math">રમો</a>
        </div>

    </div>

    <!-- ૨. વિજ્ઞાન વિભાગ -->
    <div class="subject-title">🔬 વિજ્ઞાન (Science)</div>
    <div class="container">

        <!-- વિજ્ઞાનની રમત ૧ -->
        <div class="card card-science">
            <h3>પાક ઉત્પાદન અને વ્યવસ્થાપન</h3>
            <a href="./pak-utpadan.html" class="btn btn-science">રમો</a>
        </div>

    </div>

    <br>
    <!-- મુખ્ય હોમ પેજ પર પાછા જવાનું બટન -->
    <a href="../index.html" class="back-btn">⬅️ મુખ્ય હોમ પેજ પર પાછા જાઓ</a>

</body>
</html>
